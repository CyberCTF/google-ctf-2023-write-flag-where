# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# write-flag-where (Google's 2023 security competition, by Google; a pwn challenge) as an Isoloom spec:
# a program that prints its own memory mappings and writes the flag at any address you choose.
# The challenge folder 2023/quals/pwn-write-flag-where of Google's challenge archive is vendored unchanged in build/challenge/app/ and built by the overlay Dockerfile next to it.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2023-write-flag-where

networks:
  lab: { cidr: 10.60.175.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    docker:
      build: build/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the program greets with its rhyme and its memory mappings
    script: checks/probe.sh
    wait: 60

message: |
  write-flag-where (Google, 2023) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  The mappings are given; where could the flag be written so that the program prints it back?
